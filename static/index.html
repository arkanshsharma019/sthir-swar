<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f0">
  <link rel="icon" href="/static/character.svg">
  <title>Sthir Swar</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#home" class="brand" aria-label="Home">
      <img src="/static/character.svg" alt="">
      <span><strong>Sthir Swar</strong><small data-t="tagline"></small></span>
    </a>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home" class="view">
      <div class="hero">
        <img src="/static/character.svg" alt="">
        <div><h1 id="greeting"></h1><p id="next-dose" class="next-dose" hidden></p></div>
      </div>
      <!-- Speak is the heart of the app: one big button that listens right here. -->
      <button class="mic mic-hero" id="home-mic" type="button">
        <span class="ico" aria-hidden="true">🎙️</span>
        <span class="mic-text"><span class="mic-label" data-t="tapToSpeak"></span><small data-t="speakBigHint"></small></span>
      </button>
      <div class="bubble" id="home-heard" hidden></div>
      <div class="bubble reply" id="home-reply" hidden></div>
      <div class="tiles three">
        <a href="#symptoms" class="tile tile-sym"><span class="ico" aria-hidden="true">📝</span><span data-t="symptoms"></span></a>
        <a href="#meds" class="tile tile-med"><span class="ico" aria-hidden="true">💊</span><span data-t="medicines"></span></a>
        <a href="#help" class="tile tile-help"><span class="ico" aria-hidden="true">🆘</span><span data-t="help"></span></a>
      </div>
      <div class="secondary">
        <a href="#caregiver" class="pill">👪 <span data-t="caregiver"></span></a>
        <a href="#summary" class="pill">🩺 <span data-t="summary"></span></a>
      </div>
    </section>

    <!-- SPEAK -->
    <section id="view-speak" class="view" hidden>
      <h1 data-t="speak"></h1>
      <button class="mic" id="speak-mic" type="button"><span class="ico">🎙️</span><span data-t="tapToSpeak"></span></button>
      <p class="hint" data-t="speakHint"></p>
      <div class="bubble" id="speak-heard" hidden></div>
      <div class="bubble reply" id="speak-reply" hidden></div>
      <form class="type-form" id="speak-form">
        <label for="speak-text" data-t="typeInstead"></label>
        <div class="row"><input id="speak-text" autocomplete="off"><button class="btn" data-t="send"></button></div>
      </form>
    </section>

    <!-- SYMPTOMS -->
    <section id="view-symptoms" class="view" hidden>
      <h1 data-t="symptoms"></h1>
      <button class="mic" id="sym-mic" type="button"><span class="ico">🎙️</span><span data-t="symptomPrompt"></span></button>
      <p class="hint" data-t="feelHint"></p>
      <div class="bubble" id="sym-heard" hidden></div>
      <div class="bubble reply" id="sym-reply" hidden></div>
      <form class="type-form" id="sym-form">
        <label for="sym-text" data-t="typeInstead"></label>
        <div class="row"><input id="sym-text" autocomplete="off"><button class="btn" data-t="send"></button></div>
      </form>
      <div class="quick" id="sym-quick"></div>
      <h2 data-t="recent"></h2>
      <ul class="list" id="sym-list"></ul>
    </section>

    <!-- MEDICINES -->
    <section id="view-meds" class="view" hidden>
      <h1 data-t="medsToday"></h1>
      <ul class="list doses" id="dose-list"></ul>
    </section>

    <!-- HELP -->
    <section id="view-help" class="view" hidden>
      <button class="help-big" id="help-big" type="button"><span data-t="helpBig"></span></button>
      <p class="hint center" data-t="helpPrompt"></p>
      <div class="bubble reply" id="help-reply" hidden></div>
      <h2 data-t="emergencyContacts"></h2>
      <div class="contacts" id="help-contacts"></div>
      <button class="btn btn-wide" id="help-message" type="button">✉️ <span data-t="sendMessage"></span></button>
      <h2 id="help-people-title" data-t="everyone" hidden></h2>
      <div class="people" id="help-people"></div>
    </section>

    <!-- CAREGIVER -->
    <section id="view-caregiver" class="view" hidden>
      <h1>👪 <span data-t="caregiver"></span></h1>

      <div class="card">
        <h2 data-t="cg_alerts"></h2>
        <p class="muted" data-t="cg_alertsNote"></p>
        <ul class="list compact" id="cg-alerts"></ul>
      </div>

      <div class="card">
        <h2 data-t="cg_profile"></h2>
        <form id="cg-settings" class="grid">
          <label><span data-t="cg_patientName"></span> <input name="patient_name"></label>
          <label><span data-t="cg_caregiverName"></span> <input name="caregiver_name"></label>
          <button class="btn" data-t="cg_save"></button>
        </form>
      </div>

      <div class="card">
        <h2 data-t="cg_medsTitle"></h2>
        <p class="muted" data-t="cg_medsNote"></p>
        <ul class="list compact" id="cg-meds"></ul>
        <form id="cg-med-form" class="grid">
          <label><span data-t="cg_medicine"></span>
            <select name="pick" id="cg-med-pick" required>
              <option value="" data-t="cg_choose"></option>
              <optgroup data-t-label="grp_levodopa">
                <option>Levodopa + Carbidopa (Syndopa, Tidomet)</option>
                <option>Levodopa + Carbidopa, controlled release (Syndopa CR)</option>
                <option>Levodopa + Benserazide (Madopar)</option>
                <option>Levodopa + Carbidopa + Entacapone (Stalevo)</option>
              </optgroup>
              <optgroup data-t-label="grp_agonists">
                <option>Pramipexole</option>
                <option>Ropinirole</option>
                <option>Rotigotine (skin patch)</option>
              </optgroup>
              <optgroup data-t-label="grp_maob">
                <option>Rasagiline</option>
                <option>Selegiline</option>
                <option>Safinamide</option>
              </optgroup>
              <optgroup data-t-label="grp_comt">
                <option>Entacapone</option>
                <option>Opicapone</option>
              </optgroup>
              <optgroup data-t-label="grp_others">
                <option>Amantadine</option>
                <option>Trihexyphenidyl (Pacitane)</option>
              </optgroup>
              <option value="__other" data-t="cg_otherMed"></option>
            </select>
          </label>
          <label id="cg-med-other" hidden><span data-t="cg_medName"></span> <input name="name" data-t-ph="cg_medNamePh"></label>
          <label><span data-t="cg_dose"></span> <input name="dose" placeholder="100/25 mg"></label>
          <label><span data-t="cg_times"></span> <input name="times" required placeholder="07:00, 13:00, 19:00"></label>
          <button class="btn" data-t="cg_addMed"></button>
        </form>
      </div>

      <div class="card">
        <h2 data-t="cg_contacts"></h2>
        <ul class="list compact" id="cg-contacts"></ul>
        <form id="cg-contact-form" class="grid">
          <button class="btn btn-ghost" id="cg-pick-contact" type="button" hidden data-t="cg_pickContact"></button>
          <label><span data-t="cg_name"></span> <input name="name" required></label>
          <label><span data-t="cg_phone"></span> <input name="phone" required placeholder="+91…"></label>
          <label><span data-t="cg_kind"></span>
            <select name="kind"><option value="emergency" data-t="cg_kindEmergency"></option><option value="other" data-t="cg_kindOther"></option></select>
          </label>
          <label><span data-t="cg_relation"></span> <input name="relation" data-t-ph="cg_relationPh"></label>
          <label class="check"><input type="checkbox" name="is_primary"> <span data-t="cg_primary"></span></label>
          <button class="btn" data-t="cg_addContact"></button>
        </form>
      </div>

      <div class="card">
        <h2 data-t="cg_notesTitle"></h2>
        <form id="cg-note-form" class="grid">
          <label><span data-t="cg_noteLabel"></span> <textarea name="text" rows="2" required data-t-ph="cg_notePh"></textarea></label>
          <button class="btn" data-t="cg_saveNote"></button>
        </form>
        <ul class="list compact" id="cg-notes"></ul>
      </div>

      <div class="card">
        <h2 data-t="cg_demo"></h2>
        <p class="muted" data-t="cg_demoNote"></p>
        <div class="row"><button class="btn" id="cg-demo" type="button" data-t="cg_loadDemo"></button><button class="btn btn-ghost" id="cg-reset" type="button" data-t="cg_clear"></button></div>
        <p class="muted" id="cg-ai"></p>
      </div>
    </section>

    <!-- SUMMARY -->
    <section id="view-summary" class="view" hidden>
      <div class="row between"><h1>🩺 <span data-t="summary"></span></h1>
        <div class="row no-print"><select id="sum-days" aria-label="Period" style="width:auto"><option value="7" data-t-n="7"></option><option value="14" data-t-n="14" selected></option><option value="30" data-t-n="30"></option></select>
        <button class="btn" type="button" onclick="window.print()">🖨️ <span data-t="print"></span></button></div></div>
      <div id="summary-body"></div>
    </section>
  </main>

  <!-- Medicine reminder: full-screen, flashing, spoken -->
  <div class="overlay" id="reminder" hidden role="alertdialog" aria-labelledby="reminder-title">
    <div class="reminder-card">
      <div class="ico big" aria-hidden="true">💊</div>
      <h1 id="reminder-title"></h1>
      <p class="q" data-t="didYouTake"></p>
      <div class="answers">
        <button class="btn btn-yes" data-answer="taken" type="button" data-t="yesTaken"></button>
        <button class="btn btn-later" data-answer="not_yet" type="button" data-t="notYet"></button>
        <button class="btn btn-missed" data-answer="missed" type="button" data-t="missed"></button>
      </div>
      <p class="listening-note" id="reminder-status"></p>
    </div>
  </div>

  <!-- Yes / No confirmation (calls, messages) -->
  <div class="overlay" id="confirm" hidden role="alertdialog">
    <div class="reminder-card">
      <h1 id="confirm-text"></h1>
      <div class="answers two">
        <button class="btn btn-yes" data-confirm="yes" type="button" data-t="yes"></button>
        <button class="btn btn-missed" data-confirm="no" type="button" data-t="no"></button>
      </div>
      <p class="listening-note" id="confirm-status"></p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <a href="#home" class="home-fab" id="home-fab" hidden>🏠 <span data-t="home"></span></a>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
